name: Atualizar pesquisas eleitorais

on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * *"

permissions:
  contents: write

jobs:
  update-polls:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Atualizar base de pesquisas
        run: |
          python scripts/update_polls.py

      - name: Salvar atualização
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add polls.json data/
          git diff --cached --quiet || git commit -m "Atualiza pesquisas eleitorais"

      - name: Enviar atualização
        run: |
          git push
