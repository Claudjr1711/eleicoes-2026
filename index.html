<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eleições 2026 — Apuração</title>
<style>
:root{--bg:#0b1020;--card:#121a2d;--card2:#18233b;--text:#f4f7fb;--muted:#9eabc2;--line:#263552;--accent:#4da3ff;--ok:#36c98f;--warn:#f4b740;--danger:#ff6b6b}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#08101f,#0e1728 45%,#0b1020);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}
header{padding:28px 22px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(8,16,31,.94);backdrop-filter:blur(10px);z-index:10}
.wrap{max-width:1400px;margin:auto}.brand{display:flex;justify-content:space-between;gap:20px;align-items:end}.brand h1{margin:0;font-size:30px}.brand p{margin:7px 0 0;color:var(--muted)}
.status{font-size:13px;color:var(--ok);white-space:nowrap}.nav{display:flex;gap:8px;overflow:auto;margin-top:18px}.nav button{border:1px solid var(--line);background:var(--card);color:var(--text);padding:10px 14px;border-radius:9px;cursor:pointer}.nav button.active{background:var(--accent);color:#07111f;border-color:var(--accent);font-weight:700}
main{padding:24px 22px 60px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.metric,.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px}.metric .label{color:var(--muted);font-size:12px;text-transform:uppercase}.metric .value{font-size:27px;font-weight:800;margin-top:7px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:26px 0 12px}.section-title h2{margin:0;font-size:21px}.controls{display:flex;gap:9px;flex-wrap:wrap}.controls select,.controls button{background:var(--card2);color:var(--text);border:1px solid var(--line);padding:10px 12px;border-radius:8px}
table{width:100%;border-collapse:collapse}th,td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}th{color:var(--muted);font-size:12px;text-transform:uppercase}td.num{text-align:right;font-variant-numeric:tabular-nums}.bar{height:8px;background:#263552;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#21304b;color:#d8e4f7;font-size:11px}.elected{color:var(--ok);font-weight:800}.error{color:var(--danger)}.note{color:var(--muted);font-size:12px;line-height:1.5}.empty{padding:30px;text-align:center;color:var(--muted)}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.brand{align-items:start;flex-direction:column}}
@media(max-width:560px){.grid{grid-template-columns:1fr}.brand h1{font-size:24px}th:nth-child(3),td:nth-child(3){display:none}}
</style>
</head>
<body>
<header>
<div class="wrap">
  <div class="brand">
    <div>
      <h1>ELEIÇÕES 2026 — APURAÇÃO</h1>
      <p>Dados de divulgação do Tribunal Superior Eleitoral · atualização automática</p>
    </div>
    <div class="status" id="status">● conectando ao TSE…</div>
  </div>
  <div class="nav" id="nav"></div>
</div>
</header>

<main class="wrap">
  <div id="app"></div>
</main>

<script>
const TSE = "https://resultados.tse.jus.br/oficial/ele2026";
const TURNOS = {1:{fed:6257,est:6259,label:"1º turno"},2:{fed:6258,est:6260,label:"2º turno"}};
const UF = [
["br","Brasil"],["ac","Acre"],["al","Alagoas"],["ap","Amapá"],["am","Amazonas"],["ba","Bahia"],
["ce","Ceará"],["df","Distrito Federal"],["es","Espírito Santo"],["go","Goiás"],["ma","Maranhão"],
["mt","Mato Grosso"],["ms","Mato Grosso do Sul"],["mg","Minas Gerais"],["pa","Pará"],["pb","Paraíba"],
["pr","Paraná"],["pe","Pernambuco"],["pi","Piauí"],["rj","Rio de Janeiro"],["rn","Rio Grande do Norte"],
["rs","Rio Grande do Sul"],["ro","Rondônia"],["rr","Roraima"],["sc","Santa Catarina"],["sp","São Paulo"],
["se","Sergipe"],["to","Tocantins"]
];
const CARGOS = {
 presidente:{label:"Presidente",cargo:"0001",eleicao:"fed",uf:"br"},
 governador:{label:"Governadores",cargo:"0003",eleicao:"est"},
 senador:{label:"Senado",cargo:"0005",eleicao:"est"},
 federal:{label:"Câmara dos Deputados",cargo:"0006",eleicao:"est"},
 estadual:{label:"Assembleias / CLDF",cargo:"0007",eleicao:"est"}
};

let current="presidente", turn=1, timer=null;

const fmt = n => new Intl.NumberFormat("pt-BR").format(Number(n||0));
const pct = n => (Number(n||0)*100).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})+"%";
const esc = s => String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));

function nav(){
 document.getElementById("nav").innerHTML=Object.entries(CARGOS).map(([k,v])=>
 `<button class="${k===current?"active":""}" onclick="selectCargo('${k}')">${v.label}</button>`).join("");
}
function selectCargo(k){current=k;nav();load();}

function get(obj, keys, fallback=""){
 for(const k of keys){ if(obj && obj[k]!==undefined && obj[k]!==null) return obj[k]; }
 return fallback;
}
function recursiveFind(obj, predicate, depth=0){
 if(depth>7 || obj==null) return null;
 if(Array.isArray(obj)){for(const x of obj){const r=recursiveFind(x,predicate,depth+1);if(r!==null)return r;}return null}
 if(typeof obj==="object"){
   if(predicate(obj)) return obj;
   for(const v of Object.values(obj)){const r=recursiveFind(v,predicate,depth+1);if(r!==null)return r;}
 }
 return null;
}
function findArray(obj,predicate,depth=0){
 if(depth>7||obj==null)return null;
 if(Array.isArray(obj)){if(obj.some(x=>x&&typeof x==="object"&&predicate(x)))return obj;for(const x of obj){const r=findArray(x,predicate,depth+1);if(r)return r}}
 else if(typeof obj==="object"){for(const v of Object.values(obj)){const r=findArray(v,predicate,depth+1);if(r)return r}}
 return null;
}
function normalizeCandidates(data){
 const arr=findArray(data,x=>("qtVotos" in x)||("votos" in x)||("votes" in x)||("nmUrna" in x)||("nomeUrna" in x));
 if(!arr)return [];
 return arr.map(x=>{
   const votes=Number(get(x,["qtVotos","votos","votes","vlVotos"],0))||0;
   const name=get(x,["nmUrna","nomeUrna","name","nmCandidato","nome"],"Candidato");
   const party=get(x,["sgPartido","partido","party","sgLegenda"],"");
   const share=Number(get(x,["pcVotos","percentual","voteShare","share"],0))||0;
   const situation=get(x,["dsSitTot","situacao","status","situation"],"");
   const elected=/eleit/i.test(String(situation)) || x.stEleito===true || x.eleito===true;
   return {name,party,votes,share:elected?share:share,situation,elected};
 }).filter(x=>x.name!=="").sort((a,b)=>b.votes-a.votes);
}
function stats(data,cands){
 const total=recursiveFind(data,x=>("qtVotosValidos" in x)||("votosValidos" in x)||("validVotes" in x));
 const sections=recursiveFind(data,x=>("qtSecoesTotalizadas" in x)||("secoesTotalizadas" in x)||("qtSeçõesTotalizadas" in x));
 const totalSec=recursiveFind(data,x=>("qtSecoes" in x)||("totalSecoes" in x)||("secoes" in x));
 const valid=Number(get(total,["qtVotosValidos","votosValidos","validVotes"],cands.reduce((s,x)=>s+x.votes,0)))||0;
 const done=Number(get(sections,["qtSecoesTotalizadas","secoesTotalizadas","qtSeçõesTotalizadas"],0))||0;
 const all=Number(get(totalSec,["qtSecoes","totalSecoes","secoes"],0))||0;
 return {valid,done,all};
}
async function fetchJSON(url){
 const r=await fetch(url,{cache:"no-store"});
 if(!r.ok)throw new Error("HTTP "+r.status);
 return await r.json();
}
function urlFor(key,uf){
 const c=CARGOS[key], e=TURNOS[turn][c.eleicao], folder=uf;
 return `${TSE}/${e}/dados/${folder}/${folder}-c${c.cargo}-e${String(e).padStart(6,"0")}-u.json`;
}
function chooseUF(){
 return current==="presidente"?"br":document.getElementById("uf")?.value||"sp";
}
function controls(){
 const uf=current==="presidente"?"":`<select id="uf" onchange="load()">${UF.filter(x=>x[0]!=="br").map(x=>`<option value="${x[0]}">${x[1]}</option>`).join("")}</select>`;
 const tr=`<select id="turn" onchange="turn=Number(this.value);load()"><option value="1" ${turn===1?"selected":""}>1º turno</option><option value="2" ${turn===2?"selected":""}>2º turno</option></select>`;
 return `<div class="controls">${uf}${tr}<button onclick="load()">Atualizar agora</button></div>`;
}
function render(data,cands,st){
 const cfg=CARGOS[current], totalVotes=cands.reduce((s,x)=>s+x.votes,0);
 const done=st.all?((st.done/st.all)*100):0;
 const sorted=cands.slice().sort((a,b)=>b.votes-a.votes);
 const rows=sorted.map((x,i)=>{
   const share=totalVotes?x.votes/totalVotes:(x.share>1?x.share/100:x.share);
   return `<tr><td>${i+1}</td><td><strong>${esc(x.name)}</strong>${x.elected?` <span class="elected">ELEITO</span>`:""}</td><td>${esc(x.party)}</td><td class="num">${fmt(x.votes)}</td><td class="num">${pct(share)}</td><td style="width:22%"><div class="bar"><i style="width:${Math.min(100,share*100)}%"></i></div></td></tr>`;
 }).join("");
 document.getElementById("app").innerHTML=`
 <div class="section-title"><div><h2>${esc(cfg.label)}</h2><div class="note">${current==="presidente"?"Abrangência nacional":"Resultado por unidade da Federação"}</div></div>${controls()}</div>
 <div class="grid">
   <div class="metric"><div class="label">Seções totalizadas</div><div class="value">${st.all?fmt(st.done)+" / "+fmt(st.all):"—"}</div></div>
   <div class="metric"><div class="label">Percentual totalizado</div><div class="value">${st.all?done.toFixed(2)+"%":"—"}</div></div>
   <div class="metric"><div class="label">Votos válidos</div><div class="value">${fmt(st.valid||totalVotes)}</div></div>
   <div class="metric"><div class="label">Candidaturas</div><div class="value">${fmt(cands.length)}</div></div>
 </div>
 <div class="card" style="margin-top:16px">
   <table><thead><tr><th>#</th><th>Candidato</th><th>Partido</th><th>Votos</th><th>%</th><th></th></tr></thead>
   <tbody>${rows||`<tr><td colspan="6" class="empty">Nenhum dado disponível neste arquivo.</td></tr>`}</tbody></table>
 </div>
 <div class="card" style="margin-top:16px">
   <div class="section-title" style="margin:0 0 8px"><h2>Composição / eleitos</h2></div>
   <div class="note">${cands.filter(x=>x.elected).length?cands.filter(x=>x.elected).map(x=>`<span class="pill">${esc(x.party||"SEM PARTIDO")}</span> ${esc(x.name)}`).join(" · "):"A indicação de eleitos aparece no arquivo oficial após a totalização correspondente. Para cargos proporcionais, a composição será preenchida conforme o TSE disponibilizar a situação de eleito."}</div>
 </div>
 <p class="note" style="margin-top:14px">Fonte: Tribunal Superior Eleitoral. Este painel é independente e apenas exibe os arquivos públicos de divulgação do TSE. Última leitura: ${new Date().toLocaleString("pt-BR")}.</p>`;
}
async function load(){
 nav();
 document.getElementById("status").textContent="● atualizando…";
 const uf=chooseUF();
 try{
   const data=await fetchJSON(urlFor(current,uf));
   const cands=normalizeCandidates(data);
   const st=stats(data,cands);
   render(data,cands,st);
   document.getElementById("status").textContent="● TSE conectado";
 }catch(e){
   document.getElementById("status").textContent="● erro de conexão";
   document.getElementById("app").innerHTML=`<div class="card"><h2>Não foi possível carregar os dados</h2><p class="error">${esc(e.message)}</p><p class="note">Verifique se o navegador permite a leitura dos arquivos do TSE (CORS) e se o arquivo está sendo servido por HTTPS. Você também pode consultar diretamente o Portal Resultados do TSE.</p></div>`;
 }
}
nav(); load();
clearInterval(timer); timer=setInterval(load,30000);
</script>
</body>
</html>
